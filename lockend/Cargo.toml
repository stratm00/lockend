[package]
name = "lockend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = {version = "0.8.9", features=["macros"]}
dotenvy = "0.15.7"
serde = "1.0.229"
serde_json = {version = "1.0.151", features=["raw_value"]}
sqlx = {version = "0.9.0", features = ["postgres", "runtime-tokio", "time", "json"]}
time = "0.3.55"
tokio = {version = "1.52.3", features = ["rt-multi-thread","macros", "time"]}
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
