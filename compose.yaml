services:

  db: 
    image: postgres
    environment:
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: locker
      PGDATA: /var/lib/pgsql/data
    volumes:
     - lockend-pg-data:/var/lib/pgsql/data
    expose: 
      - "5432"

  lockend:
    build: ./lockend
    image: lockend-compose:local
    ports:
      - 8001:8001
    env_file: 
      - ./lockend/.env

volumes:
  lockend-pg-data:
